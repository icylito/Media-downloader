<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Media-downloader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 8.5 V12.5"/><path d="M12 4 V12.5"/><path d="M15 8.5 V12.5"/><path d="M9 12.5 L12 15.8 L15 12.5"/></svg>
      </span>
      <span class="appname">Media-downloader</span>
      <span class="winbtns">
        <button id="btn-min" class="winbtn" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="btn-max" class="winbtn" aria-label="Maximize"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button id="btn-close" class="winbtn winbtn-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </header>

    <div class="tool">
      <div class="url">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <input id="url" type="text" spellcheck="false" placeholder="Paste a YouTube link…" aria-label="Video URL" />
        <button id="btn-paste" class="ibtn" data-tip="Paste (Ctrl+V)" aria-label="Paste from clipboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        </button>
      </div>
      <button id="btn-grab" class="grab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8.5 V12.5"/><path d="M12 4 V12.5"/><path d="M15 8.5 V12.5"/><path d="M9 12.5 L12 15.8 L15 12.5"/></svg>
        Grab
      </button>
      <button id="btn-update" class="ibtn lg" data-tip="Update yt-dlp" aria-label="Update yt-dlp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="btn-settings" class="ibtn lg" data-tip="Settings" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>
      </button>
    </div>

    <div class="chips">
      <div class="seg" role="group" aria-label="Format">
        <button class="chip" data-mode="mp4" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>MP4
        </button>
        <button class="chip" data-mode="mp3" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>MP3
        </button>
        <button class="chip" data-mode="flac" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>FLAC
        </button>
        <button class="chip" data-mode="opus" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 3 12 2.5-8 1.5 4h6"/></svg>Best audio
        </button>
      </div>
      <select id="quality" aria-label="Quality"></select>
      <span class="save">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 8h18l-1.5 10a2 2 0 0 1-2 1.7H6.5a2 2 0 0 1-2-1.7z"/></svg>
        <span id="outdir-label">…</span>
      </span>
      <button id="btn-playlist" class="ibtn" data-tip="Whole playlist" aria-label="Download whole playlist" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 11h12M4 16h7"/><path d="M17 13v7M14 17l3 3 3-3"/></svg>
      </button>
    </div>

    <main id="content">
      <div id="empty" class="empty">
        <div class="drop">
          <svg class="drop-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8.5 V12.5"/><path d="M12 4 V12.5"/><path d="M15 8.5 V12.5"/><path d="M9 12.5 L12 15.8 L15 12.5"/></svg>
          <h3>Paste a link to <em>grab</em> it</h3>
          <div class="caps">
            <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>4K video</span>
            <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>MP3 320</span>
            <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>FLAC</span>
            <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2-6 3 12 2.5-8 1.5 4h6"/></svg>Bit-perfect Opus</span>
          </div>
          <span class="kbd">or press <kbd>Ctrl</kbd><kbd>V</kbd> anywhere</span>
        </div>
      </div>
      <div id="list" class="list" hidden></div>
      <div id="log" class="log" hidden><div id="log-lines" aria-live="polite"></div></div>
    </main>

    <div id="popover" class="popover" role="dialog" aria-label="Settings" hidden>
      <div class="pop-label">Downloads</div>
      <button class="pop-item" id="pop-folder">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 8h18l-1.5 10a2 2 0 0 1-2 1.7H6.5a2 2 0 0 1-2-1.7z"/></svg>
        <span class="pop-path" id="pop-folder-path">…</span>
        <span class="pop-meta">Change</span>
      </button>
      <button class="pop-item" id="pop-playlist">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 11h12M4 16h7"/><path d="M17 13v7M14 17l3 3 3-3"/></svg>
        <span>Whole playlist</span>
        <span class="sw" id="sw-playlist" aria-hidden="true"></span>
      </button>
      <button class="pop-item" id="pop-embed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>
        <span>Embed thumbnail</span>
        <span class="sw" id="sw-embed" aria-hidden="true"></span>
      </button>
      <hr />
      <div class="pop-label">Engine</div>
      <button class="pop-item" id="pop-update">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        <span>Update yt-dlp</span>
        <span class="pop-meta" id="pop-update-meta">check</span>
      </button>
      <button class="pop-item" id="pop-log">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg>
        <span>Open log</span>
      </button>
    </div>

    <footer id="strip">
      <button id="strip-log" class="ibtn" data-tip="Log" aria-label="Toggle log">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg>
      </button>
      <span id="strip-text">Ready</span>
      <span id="strip-track" class="track" hidden><i id="strip-fill"></i></span>
      <span id="strip-eng"></span>
      <button id="strip-cancel" class="ibtn" data-tip="Cancel download" aria-label="Cancel active download" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
      </button>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
